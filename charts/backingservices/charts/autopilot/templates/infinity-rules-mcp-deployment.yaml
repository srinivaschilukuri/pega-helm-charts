{{- if and .Values.enabled .Values.infinityRulesMcp.enabled }}
{{- include "infinityRulesMcp.validate" . }}
{{- $depName := "infinity-rules-mcp-service" }}
{{- $bearer := .Values.infinityRulesMcp.auth.enabled }}
{{- $trustStore := and $bearer .Values.infinityRulesMcp.trustStore.secretName }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ $depName }}
  labels:
    app: {{ $depName }}
spec:
  replicas: {{ .Values.infinityRulesMcp.replicas }}
  selector:
    matchLabels:
      app: {{ $depName }}
  template:
    metadata:
      labels:
        app: {{ $depName }}
    spec:
      imagePullSecrets:
      - name: {{ include "backingservicesRegistrySecret" ( dict "root" .Values "defaultname" "autopilot" ) }}
      {{- range .Values.docker.imagePullSecretNames }}
      - name: {{ . }}
      {{- end }}
      {{- if .Values.infinityRulesMcp.podSecurityContext }}
      securityContext:
        {{ toYaml .Values.infinityRulesMcp.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
      - name: infinity-rules-mcp
        image: {{ .Values.docker.infinityRulesMcp.image }}
        imagePullPolicy: {{ .Values.docker.infinityRulesMcp.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.infinityRulesMcp.service.targetPort }}
        resources:
          {{- if .Values.infinityRulesMcp.resources }}
          {{ toYaml .Values.infinityRulesMcp.resources | nindent 10 }}
          {{- end }}
        securityContext:
          {{- if .Values.infinityRulesMcp.securityContext }}
          {{ toYaml .Values.infinityRulesMcp.securityContext | nindent 10 }}
          {{- end }}
        volumeMounts:
        - name: mcp-logs
          mountPath: /opt/mcp/logs
        {{- if $trustStore }}
        - name: mcp-truststore
          mountPath: /opt/mcp/truststore
          readOnly: true
        {{- end }}
        env:
        - name: SERVER_PORT
          value: {{ .Values.infinityRulesMcp.service.targetPort | quote }}
        - name: PEGA_SKILLS_PATH
          value: "/opt/infinity-skills"
        {{- if not $bearer }}
        - name: PEGA_WRITE_ENABLED
          value: "true"
        {{- end }}
        {{- with .Values.infinityRulesMcp.proxy }}
        {{- if .httpProxyHost }}
        - name: HTTP_PROXY_HOST
          value: {{ .httpProxyHost | quote }}
        {{- end }}
        {{- if .httpProxyPort }}
        - name: HTTP_PROXY_PORT
          value: {{ .httpProxyPort | quote }}
        {{- end }}
        {{- if .httpProxyUsername }}
        - name: HTTP_PROXY_USERNAME
          value: {{ .httpProxyUsername | quote }}
        {{- end }}
        {{- if .httpProxyPassword }}
        - name: HTTP_PROXY_PASSWORD
          value: {{ .httpProxyPassword | quote }}
        {{- end }}
        {{- if .noProxy }}
        - name: NO_PROXY
          value: {{ .noProxy | quote }}
        {{- end }}
        {{- end }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- if $bearer }}
        {{- include "infinityRulesMcp.bearerEnv" . | nindent 8 }}
        {{- end }}
        livenessProbe:
          initialDelaySeconds: {{ .Values.infinityRulesMcp.livenessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.infinityRulesMcp.livenessProbe.timeoutSeconds }}
          periodSeconds: {{ .Values.infinityRulesMcp.livenessProbe.periodSeconds }}
          failureThreshold: {{ .Values.infinityRulesMcp.livenessProbe.failureThreshold }}
          {{- if $bearer }}
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.infinityRulesMcp.service.targetPort }}
          {{- else }}
          tcpSocket:
            port: {{ .Values.infinityRulesMcp.service.targetPort }}
          {{- end }}
        readinessProbe:
          initialDelaySeconds: {{ .Values.infinityRulesMcp.readinessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.infinityRulesMcp.readinessProbe.timeoutSeconds }}
          periodSeconds: {{ .Values.infinityRulesMcp.readinessProbe.periodSeconds }}
          failureThreshold: {{ .Values.infinityRulesMcp.readinessProbe.failureThreshold }}
          {{- if $bearer }}
          httpGet:
            path: /actuator/health/readiness
            port: {{ .Values.infinityRulesMcp.service.targetPort }}
          {{- else }}
          tcpSocket:
            port: {{ .Values.infinityRulesMcp.service.targetPort }}
          {{- end }}
      volumes:
      - name: mcp-logs
        emptyDir: {}
      {{- if $trustStore }}
      - name: mcp-truststore
        secret:
          secretName: {{ .Values.infinityRulesMcp.trustStore.secretName }}
          items:
          - key: {{ .Values.infinityRulesMcp.trustStore.key }}
            path: {{ .Values.infinityRulesMcp.trustStore.key }}
      {{- end }}
{{ end }}
